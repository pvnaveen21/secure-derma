<!-- secura -->
<div class="h-100">
    <app-common-data-table [tableColumns]="customDataTableColumns" [tableConfig]="customDataTableConfig"
        (modelAction)="modelAction($event)" #custumtable [searchPlaceholder]="'Search by brands'">
        <div>
            <button class="secure-derma-btn border-0 h-btn" [ngClass]="{'active-btn':topBrandStatus}"
                (click)="headerBtnStatus(1,!topBrandStatus)">Top Brand</button>
        </div>
    </app-common-data-table>
</div>
<nz-modal [(nzVisible)]="isVisible" nzTitle="" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()" [nzFooter]="null"
    [nzClosable]="false" [nzMaskClosable]="false" class="padding-less-modal" [nzAutofocus]="null">

    <ng-container *nzModalContent>
        <form [formGroup]="executiveForm" (ngSubmit)="onSubmitExe()">
            <div class="pt-4">
                <div class="flex-box px-4 pb-3">
                    <h2 class="m-0">{{editUser ? 'Update': 'Add New'}} Brand</h2>
                    <div class="border rounded-pill secure-derma-close-icon clickable" (click)=handleCancel()>
                        <lucide-angular [img]="icons.common.close" [size]="20"></lucide-angular>
                    </div>
                </div>




                <div class="exe-form-content px-4 mb-5">
                    <div class=" pt-2">
                        <div class="pb-2">
                            <label class="label-text">Brand Image</label>
                        </div>

                        <app-thumbnail-upload
                            [label]="['Upload Brand Image', 'File Type: PNG, JPEG, WEBP']"
                            [showLabel]="false"
                            [enablePaste]="true"
                            [showDeleteIcon]="true"
                            [fileUrl]="fileData"
                            [allowedTypes]="['image/jpeg', 'image/png', 'image/jpg', 'image/webp']"
                            (thumbnailSelected)="onBrandImageSelected($event)"
                            (deleteImgValue)="onBrandImageRemoved()">
                        </app-thumbnail-upload>

                        <control-messages [control]="executiveForm.controls['brand_image']"></control-messages>
                    </div>

                    <div class="pt-2">
                        <div class="pb-2">
                            <label for="nameId" class="label-text">Brand Name</label>
                        </div>
                        <input nz-input formControlName="brand_name" placeholder="Enter Your New Brand" nzSize="large"
                            id="nameId" appInputSanitize [removeLeadingSpace]="true" />
                        <control-messages [control]="executiveForm.controls['brand_name']"></control-messages>
                    </div>

                    <div class="pt-2">
                        <div class="pb-2">
                            <label for="nameId" class="label-text">Brand Description</label>
                        </div>
                        <textarea nz-input placeholder="Brand Description" [nzAutosize]="{ minRows: 3, maxRows: 10 }"
                            formControlName="brand_description" appInputSanitize [removeLeadingSpace]="true"></textarea>
                        <control-messages [control]="executiveForm.controls['brand_description']"></control-messages>

                    </div>

                    <nz-divider></nz-divider>
                    <div class="flex-box switch-main rounded-xl p-3 mb-3 mt-3">
                        <div class="b1">Top Brand</div>
                        <nz-switch formControlName="is_top_brand"></nz-switch>
                    </div>

                    <div class="flex-box switch-main rounded-xl p-3 mb-3 mt-3">
                        <div class="b1">Show Brand</div>
                        <nz-switch formControlName="show_brand"></nz-switch>
                    </div>

                </div>


                <div class=" buttons  d-flex footer-btn-main align-items-center w-100 px-4 pb-4">
                    <button class="secure-derma-btn btn-lg  border-0 rounded-lg bg-danger-50 text-primary b2 fw-semibold w-100"
                        type="button" (click)="handleCancel()">Cancel</button>
                    <button class="secure-derma-btn btn-lg border-0 rounded-lg btn-primary b2 fw-semibold w-100" type="submit"
                        [disabled]="submitAPILoading">
                        {{editUser ? "Update" : "Save"}} @if (submitAPILoading) {
                        <nz-icon class="ms-2" nzType="loading"></nz-icon>
                        }
                    </button>
                </div>
            </div>

        </form>
    </ng-container>
</nz-modal>
<ng-template #brandStausTemplate let-data>
    <span [ngClass]="data.show_brand ?  'active-status':'non-status'">{{ data.show_brand ? 'Published': 'Not Published'
        }}</span>
</ng-template>

<ng-template #brandImageTemplate let-row>
    @if(row.brand_image) {
    <img [src]="row?.brand_image" alt="product image" class="table-pro-image">

    }
</ng-template>

<ng-template #topBrandTemplate let-data>
    <nz-switch [ngModel]="data.is_top_brand"
        [ngModelOptions]="{ standalone: true }"
        [nzLoading]="isTopBrandLoading(data.id)"
        [nzDisabled]="isTopBrandLoading(data.id)"
        (ngModelChange)="onTopBrandToggle(data, $event)">
    </nz-switch>
</ng-template>

<!--  -->


<ng-template #actionTemplate let-row>
    <div class="d-flex justify-content-end">
        <button nz-button nzType="default" class="more-btn border" nz-dropdown [nzDropdownMenu]="menu">
            <span class="text-xl fw-bold clickable">⋯</span>
        </button>
    </div>

    <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>

            <li nz-menu-item (click)="editAction(row)"><lucide-angular [img]="icons.common.edit"
                    [size]="20"></lucide-angular>Edit Brand</li>

            <li nz-menu-item class="text-danger pe-4" (click)="deleteAction(row.id)"><lucide-angular
                    [img]="icons.common.delete" [size]="20"></lucide-angular>Delete Brand</li>
        </ul>
    </nz-dropdown-menu>
</ng-template>


<app-delete-model #deleteModel [headerText]="headerText" [subText]="subText"
    (confirmDelete)="confirmDelete($event)"></app-delete-model>
