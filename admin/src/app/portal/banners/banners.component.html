@for (section of bannerSections; track section.title) {
<section class="banner-section mt-4">
    <div class="banner-section__header">
        <h1 class="banner-section__title m-0">{{ section.title }}</h1>
    </div>

    <div class="banner-section__grid">
        @for (item of section.items; track item.key) {
        <div class="banner-main rounded-xl p-3">
            <div class="flex-box">
                <div>
                    <h2 class="m-0">{{ item.label }}</h2>
                    @if(item.type =='single'){
                    <span><small class="text-warning">Allow only one image</small></span>
                    }
                </div>
            </div>

            <div class="mt-3 main-thumbnail-conatiner">
                @for (data of groupedBanners[item.key]; track data.id; let i = $index) {
                <app-thumbnail-upload [label]="item.uploadLabel" [showLabel]="false"
                    [allowedTypes]="['image/png', 'image/jpeg' ,'image/webp']" [enablePaste]="true"
                    [fileUrl]="data?.image ? data : null"
                    (thumbnailSelected)="onThumbnailSelected($event, i, item.key)"
                    (deleteImgValue)="deleteImgValue($event, item.key)" [download]="'true'">
                </app-thumbnail-upload>
                }
            </div>
        </div>
        }
    </div>
</section>
}
